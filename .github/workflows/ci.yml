name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest server/tests/ -v --tb=short 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # publish the failure cause as annotations (public, API-readable).
            # One ::error:: per ~260 chars — the API truncates per annotation.
            tail -45 pytest.log | grep -vE '^\s*$' | tr '\n' ' ' | \
              fold -w 260 > /tmp/failmsg.txt
            n=0
            while IFS= read -r line; do
              n=$((n+1))
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
              echo "::error::[pytlog $n] $esc"
            done < /tmp/failmsg.txt
          fi
          exit $rc

      - name: Upload pytest log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore

  # Platform-deployment pre-flight: AML builds the image from the repo
  # Dockerfile, so we verify the exact same path — build + container +
  # Add/Search round-trip — on every push.
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image (bakes mpnet + ms-marco models)
        run: |
          docker build -t minta-eval . 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            tail -40 build.log | grep -vE '^\s*$' | tr '\n' ' ' | fold -w 260 > /tmp/buildmsg.txt
            n=0
            while IFS= read -r line; do
              n=$((n+1))
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
              echo "::error::[buildlog $n] $esc"
            done < /tmp/buildmsg.txt
          fi
          exit $rc

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Start container and wait for /health
        run: |
          docker run -d --name mintaeval -e MINTA_EVAL_DB=sqlite:////tmp/eval.db -p 18000:8000 minta-eval
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18000/health >/dev/null; then echo "health OK"; exit 0; fi
            sleep 5
          done
          echo "container never became healthy"; docker logs mintaeval | tail -30; exit 1

      - name: Add/Search round-trip inside the built image
        run: |
          curl -sf -X POST http://127.0.0.1:18000/add -H 'Content-Type: application/json' \
            -d '{"request_id":"ci:smoke1","user_id":"u1","session_id":"s1","messages":[{"role":"user","content":"She prefers yoga in the morning","timestamp":1700000000000}]}'
          sleep 1
          curl -sf -X POST http://127.0.0.1:18000/search -H 'Content-Type: application/json' \
            -d '{"query":"what does she prefer?","user_id":"u1","top_k":5}' | grep -q yoga

      - name: Cleanup
        if: always()
        run: docker rm -f mintaeval 2>/dev/null || true

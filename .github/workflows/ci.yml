name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest server/tests/ -v --tb=short 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # publish the failure cause as annotations (public, API-readable).
            # One ::error:: per ~260 chars — the API truncates per annotation.
            tail -45 pytest.log | grep -vE '^\s*$' | tr '\n' ' ' | \
              fold -w 260 > /tmp/failmsg.txt
            n=0
            while IFS= read -r line; do
              n=$((n+1))
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
              echo "::error::[pytlog $n] $esc"
            done < /tmp/failmsg.txt
          fi
          exit $rc

      - name: Upload pytest log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore

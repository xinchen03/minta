# Minta — single-machine deployment
version: "3.8"

services:
  minta:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: minta
    ports:
      - "127.0.0.1:8772:8772"    # Data API + Dashboard (local only)
      - "127.0.0.1:18721:18721"  # MCP HTTP Server (local only)
      - "127.0.0.1:18730:18730"  # Autopilot API (local only)
    volumes:
      - minta_data:/data
    environment:
      - MINTA_DATABASE_URL=sqlite:////data/minta.db
      - MINTA_ENV=production
      - MINTA_EXPERT_ENABLED=true
      - MINTA_AUTOPILOT_ENABLED=true
      - MINTA_API_KEY=${MINTA_API_KEY:-}
      - MINTA_CORS_ORIGINS=http://localhost:8772
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8772/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  minta_data:
